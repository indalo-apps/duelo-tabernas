<style>
:root{--bg:#fbf1e6;--card:#ffffff;--ink:#3a1d17;--ink2:#6e4b40;--soft:#f5e2cf;--line:#e8cdb3;--acc:#a9442a;--acc-ink:#fff;--link:#9a3a20;--focus:#2563eb;color-scheme:light}
:root[data-theme="dark"]{--bg:#1d1020;--card:#2b1a2e;--ink:#fbeee2;--ink2:#d2b8aa;--soft:#3a2540;--line:#4d3352;--acc:#f2a65a;--acc-ink:#2a1205;--link:#ffb27a;--focus:#ffb27a;color-scheme:dark}

/* ===== Piezas comunes de los juegos (indalo-apps) ===== */
*{box-sizing:border-box}
html[data-fs="s"]{font-size:15px} html,html[data-fs="m"]{font-size:17px} html[data-fs="l"]{font-size:19px} html[data-fs="xl"]{font-size:21px} html[data-fs="xxl"]{font-size:24px}
html,body{margin:0;height:100%}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Nunito",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--ink2)}
h1,h2,h3{line-height:1.15}

/* Pantalla de menú */
#menu{min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.m-wrap{width:100%;max-width:520px;display:flex;flex-direction:column;flex:1}
.m-top{display:flex;justify-content:flex-end;min-height:48px}
.icon-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;font-size:1.35rem;
  box-shadow:0 2px 10px -4px rgb(0 0 0 / .35)}
.icon-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.m-hero{text-align:center;margin:4px 0 18px}
.m-hero img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px -12px rgb(0 0 0 / .5)}

.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:20px;padding:14px 16px;min-height:72px;
  background:var(--card);color:var(--ink);box-shadow:0 4px 16px -10px rgb(0 0 0 / .45)}
.mode .em{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:var(--soft)}
.mode b{display:block;font-size:1.1rem}

/* Hojas (ventanas que suben desde abajo) */
.sheet-bg{position:fixed;inset:0;background:rgb(5 10 18 / .55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;position:relative;
  padding:10px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;outline:none}

.about{display:flex;align-items:center;gap:12px}.about img{border-radius:11px}

.sheet a{color:var(--link)}
.lnk{background:none;border:0;padding:10px 0;min-height:44px;color:var(--link);text-decoration:underline;text-underline-offset:3px;font-weight:700;text-align:left}
.nov h4{margin:14px 0 4px}
.nov ul{margin:0;padding-left:20px} .nov li{margin:3px 0}
.steps{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px;counter-increment:st}
.steps li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.steps svg{width:20px;height:20px;vertical-align:-4px;stroke:var(--link);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kbd{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:0 6px;font-weight:700}
.hintbox{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.howto{margin:8px 0 0;padding-left:20px}.howto li{margin:6px 0}
#barra-act{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:60;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:.9rem;padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px -8px rgb(0 0 0 / .5)}

/* Pantalla de juego */
#juego{position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#juego canvas{display:block;width:100%;height:100%}
.hud-btn{position:absolute;z-index:5;width:48px;height:48px;border-radius:50%;border:0;background:rgb(0 0 0 / .35);color:#fff;font-size:1.3rem;font-weight:800;display:grid;place-items:center;backdrop-filter:blur(4px)}
.over{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:20px;background:rgb(0 0 0 / .45)}
.over[hidden]{display:none}
.card{background:var(--card);color:var(--ink);border-radius:24px;padding:22px 20px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 50px -20px rgb(0 0 0 / .6);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.card h2{margin:0 0 6px;font-size:1.6rem}
.card .big{font-size:3rem;font-weight:900;margin:6px 0;font-variant-numeric:tabular-nums}
.card .row{justify-content:center;margin-top:16px}
.card .btn{min-width:130px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

  <div id="install-slot"></div>
  <div class="m-hero"><img src="icon-192.png" alt="" width="96" height="96"><h1 id="titulo">Duelo en Tabernas</h1><p>Duelo del oeste en el desierto: dispara el primero, pero no antes de tiempo</p></div>
  <div class="modes">
   <button class="mode main" id="b-ia"><span class="em" aria-hidden="true">🤠</span><span><b>Contra la banda</b><span class="d" id="ia-d">Vence a los 12 pistoleros, uno a uno</span></span></button>
   <button class="mode" id="b-2j"><span class="em" aria-hidden="true">👥</span><span><b>Dos jugadores</b><span class="d">En el mismo móvil, cada uno en un extremo</span></span></button>
   <button class="mode" id="b-ref"><span class="em" aria-hidden="true">⏱️</span><span><b>Reflejos</b><span class="d">5 intentos: ¿cuántas milésimas tardas?</span></span></button>
   <button class="mode" id="b-como"><span class="em" aria-hidden="true">❓</span><span><b>Cómo se juega</b><span class="d">Espera, espera… ¡dispara!</span></span></button>
  </div>

  <div class="m-foot"><button class="ver" id="foot-ver">Ajustes</button></div>
 </div>
</section>
<section id="juego" hidden aria-label="Partida">
<canvas id="cv" role="img" aria-label="Duelo en el desierto"></canvas>
<button class="hud-btn" id="b-salir" aria-label="Salir al menú" style="top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px))">✕</button>
<div class="over" id="o-fin" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="f-t"><h2 id="f-t"></h2>
 <div class="big" id="f-big"></div><p class="muted" id="f-sub" style="margin:0"></p><p id="f-extra" style="margin:10px 0 0;font-weight:700"></p>

</section>
</main>

<script>
const CFG={"repo": "duelo-tabernas", "pre": "dt", "nombre": "Duelo en Tabernas", "corto": "Duelo en Tabernas", "color": "#3d1c4b", "aviso": "Juego de reflejos para entretenerse, de humor y sin violencia realista. El tiempo de reacción que se muestra es aproximado: depende de la pantalla y del móvil.", "soporte": "https://github.com/indalo-apps/duelo-tabernas/issues"};
const NOVEDADES=[["1.0.1",["📲 Ayuda para instalar al día con iOS 27: el botón de tres rayas dentro de la barra de la dirección"]],
  ["1.0", ["🤠 Primera versión: duelos del oeste en el desierto de Tabernas", "🎯 Contra la máquina: 12 rivales, cada uno más rápido que el anterior", "👥 Dos jugadores en el mismo móvil, cada uno en un extremo", "⏱️ Reflejos: 5 intentos y tu tiempo medio en milésimas", "🌵 Distracciones que no cuentan: si disparas antes de tiempo, pierdes la ronda", "📲 Se instala en el móvil, funciona sin conexión y se actualiza sola"]]];
window.APP={};
/* ===================== PIEZAS COMUNES (indalo-apps) ===================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const P=CFG.pre;                       // prefijo de las claves guardadas en el móvil
const VERSION=(document.querySelector('meta[name="app-version"]')||{}).content||"dev";
const AUTORES="Adela Moreno Vega y Carlos Moreno Otto";
const APP=window.APP||{};               // ganchos que define cada juego
function anunciar(t){const r=$('#sr');r.textContent='';setTimeout(()=>{r.textContent=t},30)}
function verCmp(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0}
const REDUCIR=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
// Márgenes del área segura (isla, barra de inicio) en píxeles, para dibujar en el lienzo
const _sa=document.createElement('div');_sa.setAttribute('aria-hidden','true');
_sa.style.cssText='position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(_sa);
function safe(l){return parseFloat(getComputedStyle(_sa)['padding'+l[0].toUpperCase()+l.slice(1)])||0}

/* ---------- Preferencias y aspecto ---------- */
let PREF=Object.assign({fs:'m',theme:'auto',sound:true,vibra:true},store.get(P+'-pref-v1',{}));
function guardarPref(){store.set(P+'-pref-v1',PREF)}
function applyLook(){const r=document.documentElement;r.dataset.fs=PREF.fs;
  const dark=PREF.theme==='dark'||(PREF.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme=dark?'dark':'light';
  $$('meta[name="theme-color"]').forEach(m=>m.remove());
  const m=document.createElement('meta');m.name='theme-color';m.content=getComputedStyle(r).getPropertyValue('--bg').trim()||CFG.color;document.head.appendChild(m);
  if(APP.onLook)APP.onLook();}
applyLook();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);

/* ---------- Sonido y vibración ---------- */
let AC=null;
function audio(){if(!PREF.sound)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){AC=null}return AC}
addEventListener('pointerdown',()=>{if(PREF.sound)audio()},{once:true,capture:true});
function tono(f,d=.12,tipo='sine',vol=.18,f2=null,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=tipo;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}
function ruido(d=.2,vol=.25,corte=1200){const a=audio();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=corte;
  const g=a.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(a.destination);s.start();}
function vibrar(p){if(PREF.vibra&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

/* ---------- Hojas (ventanas que suben desde abajo) ---------- */
let sheetOpener=null,skipPop=false;
function openSheet(html,label){const s=$('#sheet');
  s.innerHTML=`<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}"><div class="grab"></div><button class="x-close" data-close="btn" aria-label="Cerrar">✕</button>${html}</div></div>`;
  s.hidden=false;if(!sheetOpener||!document.body.contains(sheetOpener))sheetOpener=document.activeElement;
  if(!(history.state&&history.state.sheet))history.pushState({sheet:1,juego:!!(history.state&&history.state.juego)},'');
  const sh=s.querySelector('.sheet');sh.tabIndex=-1;sh.focus({preventScroll:true});if(APP.onSheet)APP.onSheet(true);}
function closeSheet(fromPop){const s=$('#sheet');if(s.hidden)return;s.hidden=true;s.innerHTML='';
  if(sheetOpener&&document.body.contains(sheetOpener))sheetOpener.focus({preventScroll:true});sheetOpener=null;
  if(!fromPop&&history.state&&history.state.sheet){skipPop=true;history.back()}if(APP.onSheet)APP.onSheet(false);}

const EN_WEB=/\.github\.io$/.test(location.hostname)||location.hostname==='localhost';
let actPendiente=false;
// Nunca se recarga con una ventana abierta ni con una partida empezada
function seguroRecargar(){if(!$('#sheet').hidden)return false;if(APP.enPartida&&APP.enPartida())return false;return true}
function actualizar(){if(!seguroRecargar()){actPendiente=true;return}
  $('#barra-act').hidden=false;setTimeout(()=>location.replace(location.pathname+'?u='+Date.now()),900);}
let lastCheck=0;
async function buscarVersion(force){
  if(!EN_WEB)return null;if(!force&&Date.now()-lastCheck<4000)return null;lastCheck=Date.now();
  try{const txt=await (await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text();
    const m=txt.match(/name="app-version" content="([^"]+)"/);
    if(m&&verCmp(m[1],VERSION)>0){actualizar();return m[1]}return VERSION;}catch(e){return null}}
function revisarPendiente(){if(actPendiente&&seguroRecargar()){actPendiente=false;actualizar()}}
new MutationObserver(revisarPendiente).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['hidden','class']});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')buscarVersion()});
setInterval(buscarVersion,90*1000);addEventListener('focus',()=>buscarVersion());addEventListener('pageshow',()=>buscarVersion());

/* Duelo en Tabernas: reflejos del oeste */
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const BANDA=[['Paco el Lento',520],['Curro Siesta',485],['El Botijo',455],['Manolo Polvo',430],['La Chumbera',405],['El Rambla',385],
  ['Doña Mesa',365],['El Buitre',345],['Sombra de Tabernas',325],['La Ventisca',305],['El Relámpago',285],['El Fantasma',265]];
const AZUL='#2f7de1',ROJO='#e0483b';
let SA={top:0,bottom:0};
function medir(){SA={top:safe('top'),bottom:safe('bottom')};DPR=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',()=>{if(!$('#juego').hidden)medir()});
const rnd=(a,b)=>a+Math.random()*(b-a);
const est={get banda(){return store.get(P+'-banda',0)},set banda(v){store.set(P+'-banda',v)},
  get media(){return store.get(P+'-media',0)},set media(v){store.set(P+'-media',v)},
  get mejor(){return store.get(P+'-mejor',0)},set mejor(v){store.set(P+'-mejor',v)}};

let S=null,raf=0,ahora=0;
function nuevo(modo){medir();S={modo,pts:[0,0],ronda:0,fase:'intro',rival:0,vencidos:0,tiempos:[],msg:'',msgMs:'',
  tSenal:0,tYa:0,aiMs:0,senuelo:null,ganador:-1,tRes:0,caido:-1,disparo:-1,meta:modo==='2j'?3:modo==='ia'?2:5,adelantos:0};
  ronda();}
function nombre(i){if(S.modo==='2j')return i?'Jugador 2':'Jugador 1';if(S.modo==='ia')return i?BANDA[S.rival][0]:'Tú';return 'Tú'}
function ronda(){const t=performance.now();S.ronda++;S.fase='espera';S.ganador=-1;S.caido=-1;S.disparo=-1;S.msg='';S.msgMs='';
  S.tSenal=t+1100+rnd(1200,3600);S.senuelo=null;
  if(S.modo!=='ref'&&(S.ronda>=2||S.modo==='2j')&&Math.random()<.45){const ts=Math.max(t+1000,S.tSenal-rnd(600,1500));S.senuelo={t:ts,on:false,x:-60,tipo:Math.random()<.6?'rodadora':'buitre'}}
  if(S.modo==='ia'){const base=BANDA[S.rival][1];S.aiMs=Math.round(base+rnd(-30,40))}
  anunciar(S.modo==='ref'?`Intento ${S.tiempos.length+1} de 5. Preparados…`:`Ronda ${S.ronda}. Preparados…`);
  tono(392,.12,'triangle',.12);}

function senal(t){S.fase='ya';S.tYa=t;tono(1318,.45,'triangle',.25);tono(1975,.35,'sine',.1);vibrar(25);anunciar('¡Dispara!')}
function disparoSonido(){ruido(.28,.55,2600);tono(140,.22,'square',.18,45)}

function toque(j,ts){if(!S)return;const now=performance.now();const t=(ts&&ts<=now+5&&ts>now-500)?ts:now;
  if(S.fase==='espera'){// Se ha adelantado
    if(S.modo==='ref'){S.fase='res';S.msg='¡Demasiado pronto!';S.msgMs='Espera a que salga «¡DISPARA!»';S.tRes=now;S.adelantos++;tono(200,.3,'sawtooth',.15,100);vibrar(80);anunciar('Demasiado pronto');
      setTimeout(()=>{if(S&&S.fase==='res')ronda()},1500);return}
    resolver(1-j,null,`¡${nombre(j)==='Tú'?'Te has':nombre(j)+' se ha'} adelantado!`);return}
  if(S.fase==='ya'){const ms=Math.max(1,Math.round(t-S.tYa));
    if(S.modo==='ref'){S.tiempos.push(ms);S.fase='res';S.tRes=now;S.disparo=0;S.msg=`${ms} ms`;S.msgMs=valorar(ms);disparoSonido();anunciar(`${ms} milésimas. ${S.msgMs}`);
      setTimeout(()=>{if(!S)return;if(S.tiempos.length>=5)finRef();else ronda()},1400);return}
    resolver(j,ms);}}
function valorar(ms){return ms<200?'¡Increíble!':ms<250?'¡Rapidísimo!':ms<300?'¡Muy rápido!':ms<360?'Bien':ms<450?'Normalito':'Un poco lento'}

function resolver(g,ms,motivo){S.fase='res';S.ganador=g;S.tRes=performance.now();S.pts[g]++;S.disparo=ms!=null||motivo?g:-1;S.caido=1-g;
  disparoSonido();setTimeout(()=>{if(S&&S.caido>=0)tono(90,.25,'sine',.15)},350);
  if(motivo){S.msg=motivo;S.msgMs=`Punto para ${nombre(g)==='Tú'?'ti':nombre(g)}`;tono(200,.3,'sawtooth',.12,100)}
  else{S.msg=nombre(g)==='Tú'?'¡Le has ganado!':`¡Gana ${nombre(g)}!`;S.msgMs=`${ms} ms`}
  vibrar(g===0||S.modo==='2j'?[30,30,30]:120);anunciar(`${S.msg} ${S.msgMs}`);
  setTimeout(()=>{if(!S)return;if(S.pts[g]>=S.meta)finDuelo(g);else ronda()},1900);}

function finDuelo(g){S.fase='fin';let tit,big,sub,extra,boton='Otra vez';
  if(S.modo==='2j'){tit=`🏆 ¡Gana el ${nombre(g)}!`;big=`${S.pts[0]} – ${S.pts[1]}`;sub='Jugador 1 – Jugador 2';extra='';fanfarria()}
  else if(g===0){S.vencidos++;if(S.vencidos>est.banda)est.banda=S.vencidos;
    if(S.rival>=BANDA.length-1){tit='🌵 ¡Has limpiado Tabernas!';big=`${S.vencidos}/12`;sub='pistoleros vencidos';extra='Eres la leyenda del desierto.';fanfarria()}
    else{tit=`¡Has vencido a ${BANDA[S.rival][0]}!`;big=`${S.vencidos}/12`;sub='pistoleros vencidos';extra=`Siguiente: ${BANDA[S.rival+1][0]}, más rápido todavía`;boton='Siguiente duelo';S.siguiente=true;tono(784,.2,'triangle',.2);tono(1046,.3,'triangle',.2,null,.15)}}
  else{tit=`Te ha ganado ${BANDA[S.rival][0]}`;big=S.vencidos;sub=S.vencidos===1?'pistolero vencido':'pistoleros vencidos';extra=`Récord: ${est.banda} de 12`;tono(300,.5,'sawtooth',.1,120)}
  mostrarFin(tit,big,sub,extra,boton);}
function finRef(){S.fase='fin';const m=Math.round(S.tiempos.reduce((a,b)=>a+b,0)/S.tiempos.length),mj=Math.min(...S.tiempos);
  const rec=!est.media||m<est.media;if(rec)est.media=m;if(!est.mejor||mj<est.mejor)est.mejor=mj;
  mostrarFin(rec?'🏆 ¡Nuevo récord!':'Tus reflejos',`${m} ms`,'de media en 5 intentos',`Mejor intento: ${mj} ms · Récord de media: ${est.media} ms${S.adelantos?` · Adelantos: ${S.adelantos}`:''}`,'Otra vez');if(rec)fanfarria();}
function fanfarria(){[523,659,784,1046].forEach((f,i)=>tono(f,.25,'triangle',.18,null,i*.12));vibrar([30,40,30,40,60])}
function mostrarFin(t,b,s,e,boton){$('#f-t').textContent=t;$('#f-big').textContent=b;$('#f-sub').textContent=s;$('#f-extra').textContent=e;$('#b-otra').textContent=boton;
  $('#o-fin').hidden=false;$('#b-otra').focus();anunciar(`${t}. ${b} ${s}. ${e}`)}

/* ---------- Bucle ---------- */
function paso(t){raf=requestAnimationFrame(paso);ahora=t;if(!S)return;
  if(S.fase==='espera'){if(S.senuelo&&!S.senuelo.on&&t>=S.senuelo.t){S.senuelo.on=true;S.senuelo.t0=t;
      if(S.senuelo.tipo==='buitre'){tono(1300,.18,'sawtooth',.12,700);tono(1200,.2,'sawtooth',.1,650,.22)}else ruido(.6,.08,500);
      if(S.modo==='ia'&&Math.random()<.08){S.fase='x';setTimeout(()=>{if(S&&S.fase==='x'){S.fase='espera';resolver(0,null,`¡${BANDA[S.rival][0]} se ha adelantado!`)}},120)}}
    if(t>=S.tSenal)senal(t);}
  else if(S.fase==='ya'&&S.modo==='ia'&&t-S.tYa>=S.aiMs)resolver(1,S.aiMs);
  dibujar(t);}

/* ---------- Dibujo ---------- */
function dibujar(t){ctx.setTransform(DPR,0,0,DPR,0,0);const hz=H*.6;
  const sk=ctx.createLinearGradient(0,0,0,hz);sk.addColorStop(0,'#2a1240');sk.addColorStop(.55,'#b3455a');sk.addColorStop(1,'#f6b26b');ctx.fillStyle=sk;ctx.fillRect(0,0,W,hz+2);
  // Sol
  const sr=Math.min(W,H)*.17;const sg=ctx.createRadialGradient(W*.5,hz-sr*.35,sr*.2,W*.5,hz-sr*.35,sr*2.2);sg.addColorStop(0,'rgba(255,214,140,.55)');sg.addColorStop(1,'rgba(255,214,140,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,hz);ctx.fillStyle='#ffd889';ctx.beginPath();ctx.arc(W*.5,hz-sr*.35,sr,0,7);ctx.fill();
  // Montañas de Tabernas (dos capas)
  ctx.fillStyle='#8c3b3a';montes(hz,[0,.62,.08,.55,.18,.7,.3,.5,.42,.58,.55,.45,.68,.6,.8,.48,.92,.63,1,.52],H*.16);
  ctx.fillStyle='#5b2531';montes(hz,[0,.35,.1,.42,.22,.25,.36,.38,.5,.2,.63,.33,.75,.22,.88,.4,1,.28],H*.1);
  // Suelo
  const sg2=ctx.createLinearGradient(0,hz,0,H);sg2.addColorStop(0,'#c97b48');sg2.addColorStop(1,'#7a3d23');ctx.fillStyle=sg2;ctx.fillRect(0,hz,W,H-hz);
  ctx.strokeStyle='rgba(255,220,180,.12)';ctx.lineWidth=2;for(let i=1;i<7;i++){const y=hz+(H-hz)*(i*i/49);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // Pitas
  pita(W*.08,hz+(H-hz)*.18,W*.05);pita(W*.93,hz+(H-hz)*.1,W*.04);
  // Pistoleros
  const pie=hz+(H-hz)*.32,alto=Math.min(H*.2,W*.42);
  const kr=S&&S.fase==='res'||S&&S.fase==='fin'?Math.min(1,(performance.now()-S.tRes)/500):0;
  for(const j of [0,1]){const caer=S&&S.caido===j?kr:0,disp=S&&S.disparo===j?kr:0,senal=S&&S.fase==='ya';
    vaquero(j?W*.78:W*.22,pie,alto,j?-1:1,j?ROJO:AZUL,caer,disp,senal,t)}
  // Distracción
  if(S&&S.senuelo&&S.senuelo.on){const e=(t-S.senuelo.t0)/1600;if(e<1){if(S.senuelo.tipo==='rodadora')rodadora(-40+e*(W+80),pie-alto*.06,alto*.09,e*14);else buitre(W*(1.1-e*1.2),H*.18+Math.sin(e*9)*10,W*.06,t)}}
  if(!S)return;
  // Textos
  const dos=S.modo==='2j';
  if(dos){ctx.save();ctx.globalAlpha=.10;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H/2-1);ctx.restore();ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(0,H/2-1,W,2)}
  const pinta=(fn)=>{if(dos){ctx.save();ctx.translate(W,H);ctx.rotate(Math.PI);fn(1);ctx.restore();fn(0)}else fn(-1)};
  pinta(j=>{const yc=dos?H*.78:H*.27;const lado=j===-1?null:j;
    if(S.fase==='espera'||S.fase==='x'){texto('Preparados…',W/2,yc,Math.min(W*.1,40),'#fff',.85)}
    else if(S.fase==='ya'){const k=Math.min(1,(t-S.tYa)/90);texto('¡DISPARA!',W/2,yc,Math.min(W*.17,72)*(1.25-.25*k),'#ffe14d',1,true)}
    else if(S.fase==='res'){let m=S.msg,ms=S.msgMs;
      if(dos&&S.ganador>=0){const yo=lado;if(m.startsWith('¡Gana'))m=S.ganador===yo?'¡Has ganado!':'¡Has perdido!';
        else if(m.includes('adelantado'))m=S.ganador===yo?`¡${nombre(1-yo)} se ha adelantado!`:'¡Te has adelantado!';}
      texto(m,W/2,yc,Math.min(W*.085,34),'#fff',1,true);if(ms)texto(ms,W/2,yc+Math.min(W*.1,42),Math.min(W*.07,28),'#ffe9b0',1)}
    // Marcador
    const ym=dos?H-48-SA.bottom:Math.max(64,SA.top+64);
    if(S.modo==='ref'){texto(`Intento ${Math.min(S.fase==='res'&&S.disparo===0?S.tiempos.length:S.tiempos.length+1,5)} de 5`,W/2,ym,17,'#fff',.9)}
    else{const yo=lado===null?0:lado;const a=S.pts[yo],b=S.pts[1-yo];
      texto(dos?`Tú ${puntos(a)}   ${puntos(b)} Rival`:`${puntos(a)}  vs  ${puntos(b)}`,W/2,ym,18,'#fff',.95);
      if(!dos)texto(`${BANDA[S.rival][0]} · rival ${S.rival+1} de 12`,W/2,ym+24,14,'#ffe9b0',.9);
      if(dos)texto(`${nombre(yo)} · toca en tu mitad`,W/2,ym+24,14,yo?'#ffb3ab':'#b9d6ff',.95)}});}
const puntos=n=>Array.from({length:S.meta},(_,i)=>i<n?'●':'○').join('');
function texto(s,x,y,sz,col,al=1,sombra){ctx.save();ctx.globalAlpha=al;ctx.font=`900 ${sz}px system-ui,-apple-system,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(sombra){ctx.lineWidth=Math.max(3,sz*.12);ctx.strokeStyle='rgba(40,10,20,.7)';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore()}
function montes(hz,pts,alt){ctx.beginPath();ctx.moveTo(0,hz+1);for(let i=0;i<pts.length;i+=2)ctx.lineTo(pts[i]*W,hz-pts[i+1]*alt);ctx.lineTo(W,hz+1);ctx.closePath();ctx.fill()}
function pita(x,y,s){ctx.fillStyle='#4f5a2c';for(let k=-3;k<=3;k++){ctx.save();ctx.translate(x,y);ctx.rotate(k*.32);ctx.beginPath();ctx.moveTo(-s*.12,0);ctx.quadraticCurveTo(0,-s*1.6,s*.12,0);ctx.fill();ctx.restore()}}
function rodadora(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.strokeStyle='#9c7a4a';ctx.lineWidth=2;for(let k=0;k<7;k++){ctx.beginPath();ctx.ellipse(0,0,r,r*.55,k*.45,0,7);ctx.stroke()}ctx.restore()}
function buitre(x,y,s,t){const a=Math.sin(t/90)*.5;ctx.strokeStyle='#1b0f14';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-s,y-s*a);ctx.quadraticCurveTo(x-s*.4,y-s*.4,x,y);ctx.quadraticCurveTo(x+s*.4,y-s*.4,x+s,y-s*a);ctx.stroke()}
function vaquero(x,pie,h,dir,color,caer,disp,alerta,t){const u=h/100;ctx.save();ctx.translate(x,pie);
  if(caer)ctx.rotate(-dir*caer*1.4);ctx.scale(dir,1);const os='#1b0f14';ctx.fillStyle=os;ctx.strokeStyle=os;ctx.lineCap='round';ctx.lineJoin='round';
  // sombra
  ctx.save();ctx.globalAlpha=.25*(1-caer);ctx.beginPath();ctx.ellipse(0,0,22*u,4*u,0,0,7);ctx.fill();ctx.restore();
  ctx.lineWidth=9*u;ctx.beginPath();ctx.moveTo(-3*u,-46*u);ctx.lineTo(-9*u,-1*u);ctx.moveTo(4*u,-46*u);ctx.lineTo(10*u,-1*u);ctx.stroke();
  ctx.fillRect(-14*u,-4*u,11*u,4*u);ctx.fillRect(5*u,-4*u,12*u,4*u);
  ctx.beginPath();ctx.moveTo(-13*u,-80*u);ctx.lineTo(13*u,-80*u);ctx.lineTo(10*u,-44*u);ctx.lineTo(-10*u,-44*u);ctx.closePath();ctx.fill();
  ctx.fillStyle='#3b2418';ctx.fillRect(-11*u,-50*u,22*u,5*u);ctx.fillStyle='#d9a441';ctx.fillRect(-2*u,-50*u,4*u,5*u);ctx.fillStyle=os;
  ctx.fillRect(9*u,-48*u,6*u,12*u);// funda
  // pañuelo
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-8*u,-81*u);ctx.lineTo(8*u,-81*u);ctx.lineTo(0,-70*u);ctx.closePath();ctx.fill();ctx.fillStyle=os;
  ctx.beginPath();ctx.arc(0,-89*u,8.5*u,0,7);ctx.fill();
  // brazo de atrás
  ctx.lineWidth=7*u;ctx.beginPath();ctx.moveTo(-10*u,-76*u);ctx.lineTo(-15*u,-52*u);ctx.stroke();
  // brazo de disparar
  const tens=alerta&&!disp&&!caer?Math.sin(t/40)*1.2*u:0;
  if(disp){ctx.beginPath();ctx.moveTo(10*u,-76*u);ctx.lineTo(32*u,-73*u);ctx.stroke();ctx.fillRect(30*u,-77*u,16*u,5*u);ctx.fillRect(31*u,-74*u,5*u,9*u);
    if(disp<.45){ctx.fillStyle='#ffe14d';ctx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5,r=(k%2?5:13)*u*(1.2-disp);ctx.lineTo(48*u+r*Math.cos(a)+6*u,-75*u+r*Math.sin(a))}ctx.fill();ctx.fillStyle=os}}
  else{ctx.beginPath();ctx.moveTo(10*u,-76*u);ctx.lineTo(15*u+tens,-52*u);ctx.stroke();ctx.fillRect(10*u,-47*u,5*u,9*u)}
  // sombrero (vuela si cae)
  ctx.save();if(caer){ctx.translate(-caer*18*u,-caer*30*u);ctx.rotate(-caer*1.2)}
  ctx.beginPath();ctx.ellipse(0,-96*u,18*u,3.5*u,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-9*u,-96*u);ctx.lineTo(-8*u,-110*u);ctx.quadraticCurveTo(0,-106*u,8*u,-110*u);ctx.lineTo(9*u,-96*u);ctx.closePath();ctx.fill();
  ctx.fillStyle=color;ctx.fillRect(-9*u,-100*u,18*u,3*u);ctx.restore();ctx.restore();}

/* ---------- Pantallas y controles ---------- */
function abrir(modo){$('#menu').hidden=true;$('#juego').hidden=false;$('#o-fin').hidden=true;history.pushState({juego:1},'');nuevo(modo);
  cancelAnimationFrame(raf);raf=requestAnimationFrame(paso);cv.setAttribute('aria-label',modo==='2j'?'Duelo para dos: el jugador 2 toca en la mitad de arriba y el jugador 1 en la de abajo':'Duelo en el desierto: toca la pantalla cuando salga «¡DISPARA!»');}
function salir(fromPop){cancelAnimationFrame(raf);S=null;$('#juego').hidden=true;$('#menu').hidden=false;pintarMenu();
  if(!fromPop&&history.state&&history.state.juego){skipPop=true;history.back()}$('#b-ia').focus();}
APP.enPantallaJuego=()=>!$('#juego').hidden;
APP.enPartida=()=>!!S&&(S.fase!=='fin'||!!S.siguiente);
APP.salir=salir;
APP.onSheet=ab=>{if(ab&&S&&(S.fase==='espera'||S.fase==='ya')){S.ronda--;S.pts=S.pts.slice();S.fase='pausa'}else if(!ab&&S&&S.fase==='pausa')ronda()};
$('#juego').addEventListener('pointerdown',e=>{if(e.target.closest('button,.over'))return;e.preventDefault();if(!S)return;
  const j=S.modo==='2j'&&e.clientY<H/2?1:0;toque(j,e.timeStamp)});
addEventListener('keydown',e=>{if($('#juego').hidden||!$('#sheet').hidden||!S||!$('#o-fin').hidden)return;
  if(e.key==='Escape'){e.preventDefault();salir();return}if(e.repeat)return;
  if(S.modo==='2j'){if(e.key==='a'||e.key==='A'){e.preventDefault();toque(0,e.timeStamp)}else if(e.key==='l'||e.key==='L'){e.preventDefault();toque(1,e.timeStamp)}}
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();toque(0,e.timeStamp)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&(S.fase==='espera'||S.fase==='ya')){S.ronda--;S.fase='pausa'}else if(!document.hidden&&S&&S.fase==='pausa'&&$('#sheet').hidden)ronda()});
$('#b-salir').addEventListener('click',()=>salir());$('#b-menu').addEventListener('click',()=>salir());
$('#b-otra').addEventListener('click',()=>{$('#o-fin').hidden=true;if(S&&S.siguiente){S.siguiente=false;S.rival++;S.pts=[0,0];S.ronda=0;ronda()}else nuevo(S?S.modo:'ia')});
$('#b-ia').addEventListener('click',()=>abrir('ia'));$('#b-2j').addEventListener('click',()=>abrir('2j'));$('#b-ref').addEventListener('click',()=>abrir('ref'));
$('#b-como').addEventListener('click',()=>openSheet(`<h2>Cómo se juega</h2>
  <ol class="howto"><li>Los dos pistoleros esperan quietos. Cuando aparezca <b>«¡DISPARA!»</b> (y suene la campana), <b>toca la pantalla</b> lo antes posible.</li>
  <li>Si tocas <b>antes de tiempo</b>, pierdes la ronda. Cuidado con las <b>distracciones</b>: una rodadora o un buitre no cuentan.</li>
  <li><b>Contra la banda</b>: gana 2 rondas para vencer a cada pistolero. Son 12, cada uno más rápido que el anterior.</li>
  <li><b>Dos jugadores</b>: poned el móvil en la mesa, cada uno en un extremo. El jugador 1 toca en la mitad de abajo y el jugador 2 en la de arriba. Gana quien llegue a 3. Con teclado: <span class="kbd">A</span> y <span class="kbd">L</span>.</li>
  <li><b>Reflejos</b>: 5 intentos y tu tiempo medio en milésimas de segundo.</li></ol>
  <p class="muted" style="font-size:.85rem">El tiempo es aproximado: cada pantalla y cada móvil tardan un poco en reaccionar.</p>
  <div class="sheet-nav"><button class="btn block" data-close="btn">¡Al desierto!</button></div>`,'Cómo se juega'));
function pintarMenu(){const b=est.banda,m=est.media;
  $('#ia-d').textContent=b?`Tu récord: ${b} de 12 pistoleros`:'Vence a los 12 pistoleros, uno a uno';
  $('#records').innerHTML=(b?`<span class="rec">🤠 Banda: ${b}/12</span>`:'')+(m?`<span class="rec">⏱️ Reflejos: ${m} ms</span>`:'');}
pintarMenu();

arrancarComun();
</script>
</body>
</html>
